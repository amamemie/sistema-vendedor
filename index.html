<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f1" />
    <meta name="description" content="Marketplace multivendedor: catálogo, carrito, pedidos y paneles de vendedor y administrador." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sistema Vendedor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica el tema guardado antes de pintar, para evitar el destello blanco.
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('sv-theme') || 'system'; } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        try { var l = localStorage.getItem('sv-lang'); if (l) document.documentElement.lang = l.slice(0, 2); } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
